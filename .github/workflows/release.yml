# Ручной выпуск готовой сборки.
# Когда выходит новый 7-Zip: Actions → Release → Run workflow → вставить ссылку
# на консольную версию для macOS (7zXXXX-mac.tar.xz или -mac-x64.tar.xz) с https://www.7-zip.org/download.html.
# Вторая сборка берётся оттуда же, из двух 7zz склеивается универсальный, и 7-Zip.app
# с ним внутри публикуется как релиз с образом диска.

name: Release

on:
  workflow_dispatch:
    inputs:
      url:
        description: "Link to the macOS console 7-Zip (7zXXXX-mac.tar.xz or 7zXXXX-mac-x64.tar.xz) from the 7-zip.org download page"
        required: true
        type: string
      draft:
        description: "Create as a draft (publish manually after checking)"
        required: false
        type: boolean
        default: false
      publish:
        description: "Publish a release (off — only build and attach the .dmg to this run)"
        required: false
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    # macOS 26: значок Icon Composer (светлый и тёмный варианты) собирается только на нём.
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Select newest Xcode
        run: |
          xcode="$(ls -d /Applications/Xcode_*.app 2>/dev/null | sort -V | tail -1)"
          if [ -n "$xcode" ]; then sudo xcode-select -s "$xcode"; fi
          xcodebuild -version
          swiftc --version

      - name: Build
        id: build
        env:
          SEVENZIP_URL: ${{ inputs.url }}
        run: ./release.sh "$SEVENZIP_URL" dist

      - name: Attach build to this run
        if: ${{ !inputs.publish }}
        uses: actions/upload-artifact@v4
        with:
          name: 7-Zip-${{ steps.build.outputs.version }}-macOS-${{ steps.build.outputs.label }}
          path: dist/*

      - name: Publish release
        if: ${{ inputs.publish }}
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.build.outputs.version }}
          NOTES: ${{ steps.build.outputs.notes }}
          DRAFT: ${{ inputs.draft }}
        run: |
          # Тег v26.06; если такой уже есть (пересборка той же версии) — v26.06-2, v26.06-3…
          tag="v$VERSION"; n=1
          while gh release view "$tag" >/dev/null 2>&1; do n=$((n + 1)); tag="v$VERSION-$n"; done
          flags=()
          if [ "$DRAFT" = "true" ]; then flags+=(--draft); fi
          gh release create "$tag" dist/* \
            --target "$GITHUB_SHA" \
            --title "7-Zip $VERSION for macOS" \
            --notes-file "$NOTES" \
            "${flags[@]}"
          echo "### Released [$tag]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/tag/$tag)" >> "$GITHUB_STEP_SUMMARY"
